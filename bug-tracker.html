<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Tracker | Sara Jabeen</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --border: rgba(200,169,110,0.2);
    --accent: #c8a96e;
    --text: #f0ece4;
    --muted: #888880;
    --critical: #e05252;
    --major: #e09a52;
    --minor: #52a8e0;
    --open: #e05252;
    --inprogress: #e0c052;
    --resolved: #52c07a;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }
  header h1 { font-size: 2.2rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 0.3rem; }
  header p { color: var(--muted); font-size: 0.9rem; letter-spacing: 1px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem; margin-bottom: 2rem;
  }
